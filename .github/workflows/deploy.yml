name: 서버 자동 배포

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    # AWS 서버(라벨 aws)의 러너에서 실행해요
    runs-on: [self-hosted, aws]
    steps:
      - uses: actions/checkout@v5
      - name: 새 코드로 다시 만들고 켜기
        run: docker compose -p runkk --env-file /home/ubuntu/runkk/.env up -d --build
      - name: 안 쓰는 옛날 상자 정리
        run: docker image prune -f