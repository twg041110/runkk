name: 서버 자동 배포

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
      - name: 새 코드로 다시 만들고 켜기
        run: docker compose -p runkk --env-file C:\runkk\.env up -d --build
      - name: 안 쓰는 옛날 상자 정리
        run: docker image prune -f