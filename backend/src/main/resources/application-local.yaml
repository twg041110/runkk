# 내 PC 에서 DB 설치 없이 서버를 켜 보는 설정
# 실행: ./gradlew bootRun --args='--spring.profiles.active=local'
# 데이터는 backend/data 폴더의 파일에 저장된다 (지우면 처음 상태로 돌아감)
spring:
  datasource:
    url: jdbc:h2:file:./data/runkk-local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    show-sql: false

runkk:
  seed: true
