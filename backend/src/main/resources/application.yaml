# application.yml
server:
  port: 8080

spring:
  profiles:
    include: secret  # 핵심: application-secret.yml을 합쳐서 실행하라는 뜻
    
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true